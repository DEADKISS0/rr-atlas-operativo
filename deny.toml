[advisories]
version = 2
ignore = [
  # Dependencia indirecta de Leptos; el advisory no tiene upgrade seguro disponible.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-3-Clause",
  "CC0-1.0",

  "LicenseRef-RR-Internal",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
